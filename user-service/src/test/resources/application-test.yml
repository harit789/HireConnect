spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-id
            client-secret: test-secret

jwt:
  secret: hireconnect_jwt_secret_key_2026_secure_random_value_must_be_32chars
  expiration: 86400000

eureka:
  client:
    enabled: false
